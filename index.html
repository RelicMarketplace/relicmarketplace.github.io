
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RELIC — Collect Something Rare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 7%;
      border-bottom: 1px solid #292929;
    }
    .logo { font-size: 28px; font-weight: 900; letter-spacing: 4px; }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-size: 13px;
    }
    .hero {
      padding: 110px 7%;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(48px, 9vw, 100px);
      letter-spacing: 8px;
      margin: 0;
    }
    .hero p { color: #aaa; letter-spacing: 2px; }
    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: white;
      color: black;
      text-decoration: none;
      font-weight: bold;
    }
    .section { padding: 40px 7% 80px; }
    .section h2 { letter-spacing: 3px; }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .category {
      border: 1px solid #333;
      padding: 35px 20px;
      text-align: center;
      color: white;
      background: #151515;
    }
    footer {
      border-top: 1px solid #292929;
      padding: 30px;
      text-align: center;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">RELIC.</div>
    <nav>
      <a href="#">HOME</a>
      <a href="#categories">EXPLORE</a>
      <a href="#">SELL</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>FIND THE RARE.</h1>
      <p>BUY. SELL. DISCOVER.</p>
      <a class="button" href="#categories">EXPLORE COLLECTIONS</a>
    </section>

    <section class="section" id="categories">
      <h2>EXPLORE CATEGORIES</h2>
      <div class="categories">
        <div class="category">TRADING CARDS</div>
        <div class="category">COLLECTIBLE FIGURES</div>
        <div class="category">SPORTS MEMORABILIA</div>
        <div class="category">COINS</div>
      </div>
    </section>
  </main>

  <footer>RELIC. — A MARKETPLACE FOR COLLECTORS.</footer>
</body>
</html>
